{% extends 'base.html' %}
{% block content %}
    <h1>Manage Products</h1>
    <a href="{{ url_for('add_product') }}">Add New Product</a>
    <table>
        <tr>
            <th>Name</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>${{ "%.2f"|format(product.price) }}</td>
            <td>{{ product.stock }}</td>
            <td>{{ 'Yes' if product.is_active else 'No' }}</td>
            <td>
                <a href="{{ url_for('edit_product', product_id=product.id) }}">Edit</a>
                <form method="POST" action="{{ url_for('toggle_product', product_id=product.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit">{{ 'Deactivate' if product.is_active else 'Activate' }}</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
